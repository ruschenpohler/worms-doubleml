[project]
name = "worms-doubleml"
version = "0.1.0"
requires-python = ">=3.11,<4.0"
dependencies = [
    "arch>=8.0.0",
    "doubleml>=0.11.3",
    "econml>=0.16.0",
    "joblib>=1.5.3",
    "pyreadstat>=1.3.5",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
]

[project.optional-dependencies]
dev = [
    "mlflow>=2.0.0,<3.0.0",
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.4.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["src/legacy/"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.0",
]
