# project_standards.yaml
# Single source of truth for project-wide configuration.
# Agents: change thresholds here, not in source code.

# --- General ---
random_seed: 42
min_observations: 20
output_dir: output/
data_dir: data/
log_file: impl-log.jsonl

# --- Data paths ---
raw_data_dir: data/raw/
processed_data_dir: data/processed/
results_dir: results/
figures_dir: figures/
cas_store_dir: cas/store/
cas_shadow_dir: cas/shadow/

# --- Treatment definition ---
# Primary analysis pools wgrp=1 (full treatment) and wgrp=2 (partial) vs wgrp=3 (control)
# Test H0: tau_1yr = tau_2yr before interpreting pooled heterogeneity
treatment_group_values: [1, 2]
comparison_group_value: 3
test_pooling_hypothesis: true
sensitivity_drop_partial: true  # re-run pipeline wgrp=1 vs wgrp=3 only

# --- Outcomes ---
# KLPS-3 (human capital stage, ~10-15 years post-treatment)
klps3_outcomes:
  bmi_klps3:
    source_weight: s19_6aweight
    source_height: s19_5aheight
    clinical_range: [12, 60]
  underweight_klps3:
    threshold: 18.5  # BMI < 18.5
  educ_klps3:
    source: s4_8edlevel_1
    missing_codes: [998, 999]
    vocational_codes_prefix: 2  # 200+ = vocational

# KLPS-4 (economic returns stage, ~17-22 years post-treatment)
klps4_outcomes:
  earnings_klps4:
    source: s15_2_24aearn_1
    transform: log1p  # log(1 + earnings) for zeros
  employed_klps4:
    source_selfemp: s15_2_1selfemp
    source_employed: s15_3_1employed

# Romano-Wolf families by wave
romano_wolf_families:
  klps3:
    - bmi_klps3
    - underweight_klps3
    - educ_klps3
  klps4:
    - earnings_klps4
    - employed_klps4

# --- Moderators (pre-specified heterogeneity hypotheses) ---
moderators:
  - age_1998  # primary: developmental window hypothesis
  - female    # secondary: differential labor market returns
blp_interaction:
  - age_1998:female  # age x female interaction in BLP

# --- Controls (nuisance model covariates) ---
controls_include_moderators: true
controls:
  - base_std       # baseline grade (no missingness)
  - grade_retention  # grade-for-age gap, constructed post-imputation
  - parent_educ_avg  # avg of s5_2feduc and s5_7meduc, handle single-missing
  - zoneid         # zone fixed effects from schoolvar.dta
  - spill_1_3km    # schools within 1-3 km
  - spill_3_6km    # schools within 3-6 km

# --- Spillover controls ---
spillover_cols:
  - spill_1_3km
  - spill_3_6km

# --- Age imputation (MICE with LightGBM) ---
age_imputation:
  target: base_yob
  engine: miceforest
  n_imputations: 20
  predictors:
    - base_std
    - base_schid
    - s5_2feduc  # father's education (11% missing, also imputed)
    - s5_7meduc  # mother's education (16% missing, also imputed)
  excluded_from_model:
    - treated
    - psdp_treat_grp
    - female
    - age_1998
  complete_case_robustness: true  # re-run pipeline on non-missing base_yob

# --- Parental education ---
parental_education:
  father: s5_2feduc
  mother: s5_7meduc
  missing_father_pct: 11
  missing_mother_pct: 16
  stability_check: true  # compare KLPS-3 vs KLPS-4 reports

# --- Exclusion rules ---
exclude_gsp: true  # psdp_treat_grp = NA
flag_pupid_mismatches: true  # 8 boundary mismatches KLPS vs PSDP
retain_missing_secondary_outcomes: true  # handle outcome-by-outcome

# --- Cross-fitting ---
n_folds: 5
fold_strategy: GroupKFold  # grouped by base_schid
fold_group_col: base_schid

# --- Nuisance models (ATE & BLP) ---
treatment_learner: HistGradientBoostingClassifier
outcome_learner: HistGradientBoostingRegressor
gbt_max_depth: 4
gbt_early_stopping: true

# --- Causal forest (CATE) ---
cf_n_estimators: 4000
cf_min_samples_leaf: 50  # ~average school size
cf_inference: blb  # bootstrap-of-little-bags
cf_model_y: GradientBoostingRegressor
cf_model_t: GradientBoostingRegressor

# --- Targeting simulation ---
targeting_coverage_pct: 30  # top 30% by predicted CATE

# --- Robustness ---
lee_bounds_enabled: true  # standard Lee bounds for all 5 outcomes
generalized_lee_bounds: true  # conditional on moderators
mixedlm_random_effect: base_schid  # school random intercepts
parental_educ_sensitivity: true  # re-run excluding parental edu
wgrp2_sensitivity: true  # re-run dropping wgrp=2

# --- Figures ---
figure_dpi: 300

# --- School-level ---
n_schools: 75  # 73 with KLPS respondents
school_id_col: base_schid
pupil_id_col: pupid

# --- KLPS merge keys ---
klps_psdps_match_key: base_schid  # direct match to PSDP sch98v1
klps_treatment_col: psdp_treat_grp
klps_female_col: base_female
klps_yob_col: base_yob
klps_std_col: base_std
