# project_standards.yaml
# Single source of truth for project-wide configuration.
# Agents: change thresholds here, not in source code.

# --- General ---
random_seed: 42
min_observations: 20
output_dir: output/
data_dir: data/
log_file: impl-log.jsonl

# --- Data paths ---
raw_data_dir: data/raw/
processed_data_dir: data/processed/
results_dir: results/
figures_dir: figures/
cas_store_dir: cas/store/
cas_shadow_dir: cas/shadow/

# --- Raw data file paths (relative to data/raw/) ---
raw_files:
  klps3_samplemaster: KLPS-3/KLPS3_SampleMaster_PUBLIC_2015-12.dta
  klps3_imodule: KLPS-3/KLPS3_I-Module_PUBLIC_2022-02.dta
  klps3_emodule: KLPS-3/KLPS3_E-Plus-Module_PUBLIC_2022-02.dta
  klps4_samplemaster: KLPS-4/KLPS4_SampleMaster_PUBLIC_2025-12.dta
  klps4_imodule: KLPS-4/KLPS4_I-Module_PUBLIC_2025-12.dta
  klps4_emodule: KLPS-4/KLPS4_E-Module_PUBLIC_2025-12.dta
  psdp_schoolvar: KandM-2004/schoolvar.dta
  psdp_namelist: KandM-2004/namelist.dta

# --- Treatment definition ---
# Primary analysis pools wgrp=1 (full treatment) and wgrp=2 (partial) vs wgrp=3 (control)
# Test H0: tau_1yr = tau_2yr before interpreting pooled heterogeneity
treatment_group_values: [1, 2]
comparison_group_value: 3
test_pooling_hypothesis: true
sensitivity_drop_partial: true

# --- Outcomes ---
# KLPS-3 (human capital stage, ~10-15 years post-treatment)
klps3_outcomes:
  bmi_klps3:
    source_weight: s19_6aweight
    source_height: s19_5aheight
    clinical_range: [12, 60]
  underweight_klps3:
    threshold: 18.5
  educ_klps3:
    source: s4_8edlevel_1
    missing_codes: [998, 999]
    vocational_codes_prefix: 2

# KLPS-4 (economic returns stage, ~17-22 years post-treatment)
klps4_outcomes:
  earnings_klps4:
    source: s15_2_24aearn_1
    transform: log1p
  employed_klps4:
    source_selfemp: s15_2_1selfemp
    source_employed: s15_3_1employed

# Romano-Wolf families by wave
romano_wolf_families:
  klps3:
    - bmi_klps3
    - underweight_klps3
    - educ_klps3
  klps4:
    - earnings_klps4
    - employed_klps4

# --- Moderators (pre-specified heterogeneity hypotheses) ---
moderators:
  - age_1998
  - female
blp_interaction:
  - age_1998:female

# --- Controls (nuisance model covariates) ---
controls_include_moderators: true
controls:
  - age_1998
  - female
  - base_std
  - grade_retention
  - parent_educ_avg
  - zoneid
  - spill_0_3km
  - spill_3_6km

# --- Spillover controls ---
spillover_cols:
  - spill_0_3km    # total schools within 3km (ring count)
  - spill_3_6km    # total schools in 3-6km ring

# --- Age imputation (MICE with LightGBM) ---
age_imputation:
  target: base_yob
  engine: miceforest
  n_imputations: 20
  predictors:
    - base_std
    - base_schid
    - s5_2feduc
    - s5_7meduc
  excluded_from_model:
    - treated
    - psdp_treat_grp
    - female
    - age_1998
  complete_case_robustness: true

# --- Parental education ---
parental_education:
  klps3_father: s5_2feduc
  klps3_mother: s5_7meduc
  klps4_father: s5_2fatheredu
  klps4_mother: s5_7motheredu
  missing_father_pct: 11
  missing_mother_pct: 16
  stability_check: true

# --- Education code mapping (Kenyan system) ---
education_mapping:
  100: 0
  101: 0
  102: 1
  103: 2
  104: 3
  105: 4
  106: 5
  107: 6
  108: 7
  109: 8
  110: 9
  111: 10
  112: 11
  113: 12
  114: 13
  115: 14
  116: 13
  117: 14
  200_prefix: any_postsecondary

# --- Exclusion rules ---
exclude_gsp: true
flag_pupid_mismatches: true
retain_missing_secondary_outcomes: true

# --- Cross-fitting ---
n_folds: 5
fold_strategy: GroupKFold
fold_group_col: base_schid

# --- Nuisance models (ATE & BLP) ---
treatment_learner: HistGradientBoostingClassifier
outcome_learner: HistGradientBoostingRegressor
gbt_max_depth: 4
gbt_early_stopping: true

# --- Causal forest (CATE) ---
cf_n_estimators: 4000
cf_min_samples_leaf: 50
cf_inference: blb
cf_model_y: GradientBoostingRegressor
cf_model_t: GradientBoostingRegressor

# --- Targeting simulation ---
targeting_coverage_pct: 30

# --- Robustness ---
lee_bounds_enabled: true
generalized_lee_bounds: true
mixedlm_random_effect: base_schid
parental_educ_sensitivity: true
wgrp2_sensitivity: true

# --- Figures ---
figure_dpi: 300

# --- School-level ---
n_schools: 75
school_id_col: base_schid
pupil_id_col: pupid

# --- KLPS merge keys ---
klps_psdps_match_key: base_schid
klps_treatment_col: psdp_treat_grp
klps_female_col: base_female
klps_yob_col: base_yob
klps_std_col: base_std